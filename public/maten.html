<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verhuisplanner — Maten</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <h1>Verhuisplanner</h1>
      <span class="eyebrow">maten</span>
    </div>
    <div class="topbar-right">
      <span class="whoami" id="whoami"></span>
      <button type="button" class="version-badge" id="version-badge"></button>
      <a href="/planner" class="btn secondary">Naar tijdlijn</a>
      <a href="/todo" class="btn secondary">To-do</a>
      <a href="/admin" class="btn secondary" id="admin-link" style="display:none;">Beheer</a>
      <button class="btn secondary" id="logout-btn">Uitloggen</button>
    </div>
  </div>

  <div class="changelog-popover" id="changelog-popover" hidden></div>

  <div class="admin-layout" style="max-width:820px;">
    <section class="admin-section">
      <h2>Maten</h2>
      <p class="section-sub">Leg afmetingen vast, bijvoorbeeld van een raam voor gordijnen. Vul een naam in en daarna alleen de afmetingen die je hebt — lengte, breedte en hoogte zijn allemaal los in te vullen.</p>

      <table class="admin-table" id="maten-table">
        <thead>
          <tr>
            <th>Naam</th>
            <th>Lengte</th>
            <th>Breedte</th>
            <th>Hoogte</th>
            <th>Eenheid</th>
            <th>Notities</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="maten-tbody"></tbody>
      </table>

      <form id="maten-form" class="inline-form">
        <div class="field" style="min-width:180px;">
          <label for="new-maten-naam">Naam</label>
          <input type="text" id="new-maten-naam" placeholder="Bijv. Raam woonkamer" required maxlength="100">
        </div>
        <div class="field" style="max-width:100px;">
          <label for="new-maten-lengte">Lengte</label>
          <input type="number" id="new-maten-lengte" step="0.1" min="0" placeholder="—">
        </div>
        <div class="field" style="max-width:100px;">
          <label for="new-maten-breedte">Breedte</label>
          <input type="number" id="new-maten-breedte" step="0.1" min="0" placeholder="—">
        </div>
        <div class="field" style="max-width:100px;">
          <label for="new-maten-hoogte">Hoogte</label>
          <input type="number" id="new-maten-hoogte" step="0.1" min="0" placeholder="—">
        </div>
        <div class="field" style="max-width:110px;">
          <label for="new-maten-eenheid">Eenheid</label>
          <select id="new-maten-eenheid">
            <option value="cm">cm</option>
            <option value="m">m</option>
            <option value="mm">mm</option>
            <option value="inch">inch</option>
          </select>
        </div>
        <div class="field" style="min-width:160px;">
          <label for="new-maten-notities">Notities</label>
          <input type="text" id="new-maten-notities" placeholder="Optioneel" maxlength="300">
        </div>
        <button type="submit" class="btn">Toevoegen</button>
      </form>
      <div class="error-msg" id="maten-error"></div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/js/maten.js"></script>
</body>
</html>
