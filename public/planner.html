<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verhuisplanner</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <h1>Verhuisplanner</h1>
      <span class="eyebrow">tijdlijn</span>
    </div>
    <div class="topbar-right">
      <span class="whoami" id="whoami"></span>
      <a href="/admin" class="btn secondary" id="admin-link" style="display:none;">Beheer</a>
      <button class="btn secondary" id="logout-btn">Uitloggen</button>
    </div>
  </div>

  <div class="main-layout">
    <div class="panel">
      <h2>Nieuwe klus</h2>
      <form id="task-form">
        <div class="field">
          <label for="titel">Titel</label>
          <input type="text" id="titel" name="titel" placeholder="Bijv. Muur pleisteren" required>
        </div>
        <div class="field">
          <label for="categorie">Categorie</label>
          <select id="categorie" name="categorie"></select>
        </div>
        <div class="field">
          <label for="start">Startdatum</label>
          <input type="date" id="start" name="start" required>
        </div>
        <div class="field">
          <label for="eind">Einddatum</label>
          <input type="date" id="eind" name="eind" required>
        </div>
        <div class="field">
          <label for="notities">Notities</label>
          <textarea id="notities" name="notities" rows="3" placeholder="Optioneel"></textarea>
        </div>
        <button type="submit" class="btn block">Toevoegen aan tijdlijn</button>
      </form>

      <div class="legend" id="legend">
        <div class="eyebrow" style="margin-bottom:2px;">Legenda</div>
      </div>
    </div>

    <div class="timeline-area">
      <div class="timeline-toolbar">
        <div class="eyebrow">Sleep een balk om te verschuiven · sleep de randen om te verlengen · klik om te bewerken</div>
        <span class="hint" id="task-count"></span>
      </div>
      <div class="timeline-scroll" id="timeline-scroll">
        <div class="timeline-grid" id="timeline-grid"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/js/app.js"></script>
</body>
</html>
